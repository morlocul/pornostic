<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#123021"/>
      <stop offset="1" stop-color="#071109"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#7cf04a" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#7cf04a" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#7cf04a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ball" cx="0.38" cy="0.32" r="0.85">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d7e3d6"/>
    </radialGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b6ff5c"/>
      <stop offset="1" stop-color="#6fe32e"/>
    </linearGradient>
  </defs>

  <!-- badge -->
  <rect width="512" height="512" rx="116" fill="url(#badge)"/>
  <rect x="6" y="6" width="500" height="500" rx="112" fill="none" stroke="#7cf04a" stroke-opacity="0.28" stroke-width="4"/>
  <rect width="512" height="512" rx="116" fill="url(#glow)"/>

  <!-- ball -->
  <g transform="translate(238 232)">
    <circle r="150" fill="#0c1a12"/>
    <circle r="142" fill="url(#ball)"/>
    <!-- central pentagon -->
    <path d="M0 -66 63 -20 39 54 -39 54 -63 -20Z" fill="#111f16"/>
    <!-- seams to rim -->
    <g stroke="#111f16" stroke-width="12" stroke-linecap="round">
      <line x1="0" y1="-66" x2="0" y2="-132"/>
      <line x1="63" y1="-20" x2="126" y2="-40"/>
      <line x1="39" y1="54" x2="78" y2="108"/>
      <line x1="-39" y1="54" x2="-78" y2="108"/>
      <line x1="-63" y1="-20" x2="-126" y2="-40"/>
    </g>
    <!-- rim pentagon hints -->
    <path d="M104 78 132 96 122 128 92 122 90 92Z" fill="#111f16" opacity="0.9"/>
    <path d="M-104 78 -90 92 -92 122 -122 128 -132 96Z" fill="#111f16" opacity="0.9"/>
    <!-- cheeky face: open eye + wink + grin -->
    <circle cx="-34" cy="86" r="12" fill="#111f16"/>
    <path d="M18 90q16 -16 32 0" fill="none" stroke="#111f16" stroke-width="11" stroke-linecap="round"/>
    <path d="M-30 118q38 30 76 -2" fill="none" stroke="#111f16" stroke-width="11" stroke-linecap="round"/>
  </g>

  <!-- P chip (wordmark initial) -->
  <g transform="translate(372 372)">
    <circle r="86" fill="url(#chip)"/>
    <circle r="86" fill="none" stroke="#071109" stroke-opacity="0.25" stroke-width="4"/>
    <path d="M-30 -46 h44 a34 34 0 0 1 0 68 h-24 v24 h-20 Z M-10 -28 v32 h22 a16 16 0 0 0 0 -32 Z"
          fill="#0a1a0c"/>
  </g>
</svg>
