name: scrape
on:
  schedule:
    # GitHub fires scheduled triggers sparsely and late (~every 2h, not hourly),
    # so we DON'T rely on frequent triggers. Instead each run self-loops every
    # 1 min for ~6 hours, so a single fired trigger covers a whole match block.
    # Two triggers/day (with queuing below) cover ~15:00–02:50 Romania. Repo is
    # public → Actions minutes are free, so long jobs cost nothing.
    - cron: '0 12 * * *'   # ~15:00 Romania — afternoon/early-evening block
    - cron: '0 18 * * *'   # ~21:00 Romania — late-evening/night block
  workflow_dispatch:

concurrency:
  group: scrape
  cancel-in-progress: false   # a second trigger queues, then runs back-to-back

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 355   # just under GitHub's 6h hard cap
    steps:
      - name: Scrape every 1 minute for ~6 hours
        run: |
          end=$(( $(date +%s) + 350*60 ))
          i=0
          while [ "$(date +%s)" -lt "$end" ]; do
            i=$((i+1))
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
              "${{ vars.APP_URL }}/api/cron/scrape" || echo 000)
            echo "ping $i at $(date -u '+%H:%M:%S')Z -> HTTP $code"
            sleep 60
          done
