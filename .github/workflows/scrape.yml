name: scrape
on:
  schedule:
    - cron: '0,30 10-16 * * *'   # every 30 min, 13:00–19:30 Romania (pre-match window)
    - cron: '*/10 17-21 * * *'   # every 10 min, 20:00–00:50 Romania (matches ending)
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sf -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ vars.APP_URL }}/api/cron/scrape"

# Pornostic scraper schedule
