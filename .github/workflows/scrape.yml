name: scrape
on:
  schedule:
    # GitHub coalesces short intervals (*/10 fires ~hourly), so instead we
    # trigger hourly across the match window and self-loop inside each run to
    # get a real ~10-minute cadence. Repo is public → Actions minutes are free.
    - cron: '0 9-22 * * *'   # top of each hour, 12:00–01:00 Romania
  workflow_dispatch:

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Scrape every 10 minutes for ~1 hour
        run: |
          for i in $(seq 1 6); do
            echo "ping $i/6 at $(date -u '+%H:%M:%S') UTC"
            curl -sf -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
              "${{ vars.APP_URL }}/api/cron/scrape" -o /dev/null && echo "  ok" || echo "  failed (nonfatal)"
            if [ "$i" -lt 6 ]; then sleep 600; fi
          done
