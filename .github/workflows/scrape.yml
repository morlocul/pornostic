name: scrape
on:
  schedule:
    # GitHub's scheduled delivery is sparse and late (hours late, and sometimes
    # a slot is skipped entirely — observed: an entire afternoon with no trigger).
    # So the schedule is now only a SAFETY NET to (re)start the chain, NOT the
    # primary mechanism. Multiple, well-spaced lines raise the odds that at least
    # one fires each day and re-establishes the chain.
    - cron: '0 0 * * *'   # safety net — restarts the chain if it ever breaks
    - cron: '0 6 * * *'   # safety net
    - cron: '0 12 * * *'  # safety net
    - cron: '0 18 * * *'  # safety net
  workflow_dispatch:      # manual trigger — also the easiest way to (re)start the chain

permissions:
  actions: write          # allows the run to re-dispatch the next run (the chain)
  contents: read

concurrency:
  group: scrape
  cancel-in-progress: false   # a second trigger queues, then runs back-to-back

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 355   # just under GitHub's 6h hard cap
    steps:
      # Checkout so the repo exists on the runner. Without it, the hand-off step
      # below fails with "not a git repository" because `gh workflow run` tries to
      # detect the repo/ref via git.
      - uses: actions/checkout@v4
      # Loop every 1 minute for ~6 hours, hitting the app's scrape endpoint.
      # One fired run therefore covers a whole block of matches.
      - name: Scrape every 1 minute for ~6 hours
        run: |
          end=$(( $(date +%s) + 350*60 ))
          i=0
          while [ "$(date +%s)" -lt "$end" ]; do
            i=$((i+1))
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
              "${{ vars.APP_URL }}/api/cron/scrape" || echo 000)
            echo "ping $i at $(date -u '+%H:%M:%S')Z -> HTTP $code"
            sleep 60
          done
      # Hand off to the next run so the scraper stays alive around the clock
      # WITHOUT depending on GitHub's flaky scheduled delivery. The schedule
      # triggers above are the backup that re-establishes this chain if it ever
      # breaks. gh is preinstalled on GitHub-hosted ubuntu runners.
      - name: Hand off to the next run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run scrape.yml --repo "${{ github.repository }}" --ref "${GITHUB_REF_NAME:-master}"
